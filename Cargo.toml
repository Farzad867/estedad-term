[package]
name = "estedad-term"
version = "0.1.0"
edition = "2024"
authors = ["Farzad"]
description = "High-performance GPU-accelerated Persian/BiDi terminal emulator built with Rust and Vulkan"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "persian", "bidi", "vulkan", "gpu"]
categories = ["command-line-utilities", "rendering"]
repository = "https://github.com/Farzad867/estedad-term"

[dependencies]
cosmic-text = "0.19.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
vte = "0.15.0"
winit = "0.30.13"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
